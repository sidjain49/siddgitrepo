

name: infra-pipeline usingterraform
permissions: 
  id-token: write
   
   
    


on:
  
  push:
    branches: [ "main" ]
 

 
  workflow_dispatch:


jobs:
 
  build:
    
    runs-on: ubuntu-latest

    
    steps:
     
     
       - uses: actions/checkout@v4
      
       - name: Install Terraform
         uses: little-core-labs/install-terraform@v2.0.0
         with:
          version: 1.15.6
       - uses: Azure/login@v3
         with:
          creds: ${{ secrets.AZURE_CREDENTIAL }}   
       - run: terraform init
         working-directory: parentfolder
       - run: terraform plan
         working-directory: parentfolder 
       - run: terraform apply -auto-approve
         working-directory: parentfolder
       - run: terraform destroy -auto-approve
         working-directory: parentfolder
      
      
         
           
