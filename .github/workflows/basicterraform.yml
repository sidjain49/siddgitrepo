

name: infra-pipeline usingterraform
permissions: 
  id-token: write
   
   
    


on:
  
  push:
    branches: [ "main" ]
 

 
  workflow_dispatch:


jobs:
 
  build:
    
    runs-on: ubuntu-latest

    
    steps:
     
     
       - uses: actions/checkout@v4
      
       - name: Install Terraform
         uses: little-core-labs/install-terraform@v2.0.0
         with:
          version: 1.15.6
       - uses: Azure/login@v3
         with:
          client-id: 1de689ce-13a4-4bbd-b1fe-bfacb9c08b44
          tenant-id: 1171f52f-e7a8-4e84-bc3c-786a8db0cac7
          subscription-id: c8e9529b-812c-42b7-89ab-4c49d4e5a210          
       - run: terraform init
         working-directory: parentfolder
       - run: terraform plan
         working-directory: parentfolder 
       # - run: terraform apply
       #   working-directory: parentfolder  
         
           
